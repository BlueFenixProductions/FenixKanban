name: FenixKanban
options:
  bundleIdPrefix: com.bluefenixproductions
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  FenixKanban:
    type: application
    platform: iOS
    sources:
      - path: FenixKanban
        excludes:
          - "**/.DS_Store"
    resources:
      - path: FenixKanban/Resources/Assets.xcassets
      - path: FenixKanban/Core/Persistence/FenixKanban.xcdatamodeld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.FenixKanban
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FenixKanban
        CODE_SIGN_ENTITLEMENTS: FenixKanban/Resources/FenixKanban.entitlements
        SUPPORTS_MACCATALYST: NO

  FenixKanbanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FenixKanbanTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FenixKanban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.FenixKanbanTests
        GENERATE_INFOPLIST_FILE: YES
