name: FenixKanban
options:
  bundleIdPrefix: com.bluefenixproductions
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Development.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.6.625"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Xcode 26 "Recommended Settings" dialog — set here so xcodegen
    # stops reverting them on every `make generate`. Without these,
    # Xcode nags on every project open.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  FenixKanban:
    type: application
    platform: iOS
    sources:
      - path: FenixKanban
        excludes:
          - "**/.DS_Store"
          - "**/.remember/**"
          - "**/.claude/**"
          - "Resources/AppIcon.icns"
    resources:
      - path: FenixKanban/Resources/Assets.xcassets
      - path: FenixKanban/Core/Persistence/FenixKanban.xcdatamodeld
      - path: FenixKanban/Resources/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.FenixKanban
        # Partial Info.plist merged with the auto-generated one. Used for
        # keys without recognized INFOPLIST_KEY_* equivalents — currently
        # UIBackgroundModes, needed so iOS can wake the app for silent
        # CloudKit pushes (NSPersistentCloudKitContainer remote-change
        # notifications). macOS ignores UI* keys. Without this, CloudKit
        # logs "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications
        # require the 'remote-notification' background mode in your info
        # plist." and background sync degrades to foreground-only.
        INFOPLIST_FILE: FenixKanban/Resources/Info-Partial.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: FenixKanban
        CODE_SIGN_ENTITLEMENTS: FenixKanban/Resources/FenixKanban.entitlements
        SUPPORTS_MACCATALYST: NO
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": "LaunchScreen.storyboard"
    dependencies:
      # FenixKanbanWidgets is iOS-only. xcodegen 2.45.4 does not write
      # platformFilters on the Embed Foundation Extensions build file even with
      # `platformFilter: ios` set here, so the macOS app build would fail with
      # "embedded content built for iOS not allowed". The post-generate script
      # scripts/patch-widget-platform-filter.rb sets platformFilters = ["ios"]
      # on the embed build file after `make generate` runs.
      - target: FenixKanbanWidgets
        embed: true
        link: false

  FenixKanbanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "**/.DS_Store"
      # CoreData stack shared with the app. Listed here explicitly so xcodegen
      # owns the widget's Sources-phase membership for these files. Without
      # this block, `make generate` wipes the widget's CoreData symbols and
      # the widget extension stops building (the widget reads the App Group
      # store directly per issue #35). The .xcdatamodeld is listed under
      # `resources:` so xcodegen compiles a per-target `FenixKanban.momd`
      # into the widget bundle; `PersistenceController.sharedModel`'s
      # `Bundle(for: SharedModelLoader.self)` then resolves to that .momd
      # at runtime inside the widget process.
      - path: FenixKanban/Core/Persistence/PersistenceController.swift
      - path: FenixKanban/Core/Persistence/Board+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/CachedComment+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/Card+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/CardStep+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/CardTombstone+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/Column+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/ColumnTombstone+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/Label+CoreDataClass.swift
      - path: FenixKanban/Core/Persistence/NSManagedObject+Extensions.swift
      # The CoreData model goes under `sources:` (NOT `resources:`) on the
      # widget target. The widget has no PBXResourcesBuildPhase, only Sources;
      # xcodegen silently drops a `resources:` entry when there's no Resources
      # phase to put it in. Sources-phase placement is also what we want
      # functionally — xcodegen compiles the .xcdatamodeld to `FenixKanban.momd`
      # inside the widget bundle, which is how PersistenceController.sharedModel
      # (loaded via Bundle(for: SharedModelLoader.self)) resolves the model at
      # runtime inside the widget process. The app target lists it under
      # `resources:` and xcodegen smart-routes it to the app's Sources phase
      # there too — same end state, different yaml.
      - path: FenixKanban/Core/Persistence/FenixKanban.xcdatamodeld
    info:
      path: Widgets/Info.plist
      properties:
        # WidgetKit extension marker. Without NSExtensionPointIdentifier the
        # simulator install fails with `extensionDictionary must be set in
        # placeholder attributes` and the test runner can't launch. xcodegen
        # overwrites Widgets/Info.plist on every `make generate`, so the dict
        # must be declared here rather than hand-edited into the plist.
        CFBundleDisplayName: FenixKanban Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.FenixKanban.Widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/FenixKanbanWidgets.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SKIP_INSTALL: YES
        # WidgetKit requires the extension host app's Swift version.
        SWIFT_VERSION: "5.9"
        # Gates the `#if !WIDGET_EXTENSION` guard in Widgets/WidgetBoardData.swift
        # so the dual-membership file compiles in-module from the widget target
        # (entities visible in-module) and `@testable import FenixKanban` only
        # when compiled into the test target (where the internal sort extensions
        # in NSManagedObject+Extensions.swift are reached via @testable).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION

  FenixKanbanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FenixKanbanTests
        excludes:
          - "**/.DS_Store"
          - "Fixtures/**/*.json"
          - "Fixtures/**/*.md"
      # FizzyctlCommand is tested here directly (no @testable import needed —
      # it's a plain Swift file with no target-specific linkage).
      - path: tools/fizzyctl/FizzyctlCommand.swift
      # Dual membership with FenixKanbanWidgets: Widgets/WidgetBoardData.swift
      # defines the `makeWidgetBoardData(from:)` mapping the widget calls in
      # production. Compiling it into the test target lets WidgetBoardDataTests
      # exercise the EXACT production code path, not a parallel reimplementation.
      # The `#if !WIDGET_EXTENSION` guard at the top of the file activates
      # `@testable import FenixKanban` only when compiled here (the widget target
      # has WIDGET_EXTENSION set in SWIFT_ACTIVE_COMPILATION_CONDITIONS).
      - path: Widgets/WidgetBoardData.swift
    resources:
      - path: FenixKanbanTests/Fixtures
    dependencies:
      - target: FenixKanban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.FenixKanbanTests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/FenixKanban.app/Contents/MacOS/FenixKanban"
          "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
        Release:
          "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/FenixKanban.app/Contents/MacOS/FenixKanban"
          "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"

  fizzyctl:
    type: tool
    platform: macOS
    sources:
      - path: tools/fizzyctl
      # Foundation-only Fizzy client files shared from the main app target.
      # Each file imports only Foundation — verified via grep on 2026-06-12.
      - path: FenixKanban/Core/Services/Fizzy/FizzyClient.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyClient+Boards.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyClient+CardActions.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyClient+Comments.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyClient+Directory.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyError.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyResponse.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyDTOs.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyDTOs+Boards.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyDTOs+CardActions.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyDTOs+Comments.swift
      - path: FenixKanban/Core/Services/Fizzy/FizzyDTOs+Directory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluefenixproductions.fizzyctl
        PRODUCT_NAME: fizzyctl
        GENERATE_INFOPLIST_FILE: YES
        # Override project-level SDKROOT (iphoneos) for this macOS-only tool.
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SUPPORTED_PLATFORMS: macosx
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO

# XcodeGen owns the shared FenixKanban scheme so `make generate` no longer
# drops the tracked file. `scripts/add-ui-test-target.rb` overlays
# FenixKanbanUITests on top — that target is dynamically materialized and
# is not part of project.yml.
schemes:
  FenixKanban:
    build:
      targets:
        FenixKanban: all
        FenixKanbanTests: [test]
    test:
      config: Debug
      targets:
        - name: FenixKanbanTests
          parallelizable: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  fizzyctl:
    build:
      targets:
        fizzyctl: all
    run:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
